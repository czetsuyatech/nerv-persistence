logging:
  level:
    root: info
    com.czetsuyatech.nerv: debug

spring:
  # Datasource Configuration
  datasource:
    url: jdbc:h2:mem:nerv
    driver-class-name: org.h2.Driver
    username: nerv
    password: nerv

  jpa:
    properties:
      hibernate:
        connection:
          url: jdbc:h2:mem:nerv;DB_CLOSE_DELAY=-1
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
